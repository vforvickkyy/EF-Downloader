<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Eastape Downloader · Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="boot" class="boot"><img src="/logo.png" alt="" width="56" height="56"></div>

  <section id="login" class="login" hidden>
    <form id="loginForm" class="login-card" novalidate>
      <img src="/logo.png" alt="" width="64" height="64">
      <h1>Eastape Downloader</h1>
      <p class="muted">Admin dashboard</p>
      <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
      <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <p id="loginError" class="form-error" role="alert"></p>
      <button class="btn primary wide" type="submit">Sign in</button>
      <p class="fine">Eastape Tech · Made by Creators, for Creators</p>
    </form>
  </section>

  <div id="shell" class="shell" hidden>
    <aside class="side">
      <a class="brand" href="#overview">
        <img src="/logo.png" alt="" width="34" height="34">
        <span><b>Eastape</b> Downloader<small>Admin</small></span>
      </a>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <div class="me">
        <div class="me-who"><b id="meName"></b><span id="meEmail"></span></div>
        <button id="meMenu" class="icon-btn" type="button" aria-label="Account"></button>
      </div>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
</body>
</html>
